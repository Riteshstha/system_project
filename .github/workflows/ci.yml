name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/system_website_test

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript check
        run: npx tsc --noEmit

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: system_website_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run tests
        run: npx vitest run
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_SERVER_URL: http://localhost:3001
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: production
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          COMPANY_EMAIL: ${{ secrets.COMPANY_EMAIL }}
          ESEWA_MERCHANT_CODE: ${{ secrets.ESEWA_MERCHANT_CODE }}
          ESEWA_SECRET: ${{ secrets.ESEWA_SECRET }}
          ESEWA_BASE_URL: ${{ secrets.ESEWA_BASE_URL }}

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: acme-web-studio:test
          load: true

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container \
            -e DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/system_website_test \
            -e SESSION_SECRET=${{ secrets.SESSION_SECRET }} \
            -e NODE_ENV=production \
            -p 3000:3000 \
            acme-web-studio:test
          sleep 10
          curl -f http://localhost:3000/api/health || (docker logs test-container && exit 1)
          docker stop test-container
          docker rm test-container
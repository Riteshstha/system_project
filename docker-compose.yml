services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://app_user:${POSTGRES_PASSWORD}@db:5432/system_website?schema=public
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - COMPANY_EMAIL=${COMPANY_EMAIL}
      - ESEWA_MERCHANT_CODE=${ESEWA_MERCHANT_CODE}
      - ESEWA_SECRET=${ESEWA_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - internal_net
    ports:
      - "3000:3000"
      - "3200:3200"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=system_website
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  db_data:
